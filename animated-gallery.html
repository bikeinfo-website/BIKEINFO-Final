<style>
.carousel-control-prev-icon,
.carousel-control-next-icon {
    background-color: black;
    border-radius: 50%;
    padding: 20px;
    background-size: 60%;
}
.carousel-item img {
    height: 400px;
    width: 100%;
    object-fit: contain;
    background-color: white;
}
.carousel-caption {
    position: static;
    background-color: black;
    padding: 12px;
}

.carousel-caption h5 {
    color: white;
    margin: 0;
}
</style>
